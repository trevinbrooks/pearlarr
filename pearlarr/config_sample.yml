# qBittorrent connection. All of host, username, and password are needed to grab. Leave any blank
# for dry runs only (everything is reported, nothing is grabbed).
qbittorrent:
  # WebUI address of qBittorrent, e.g. http://localhost:8080. Leave any of host, username, or
  # password blank for dry runs only: runs report what they would grab and grab nothing.
  host:

  # WebUI username. Blank makes every run a dry run (see host).
  username:

  # WebUI password. Blank makes every run a dry run (see host).
  password:

  # Tags applied to every torrent added. Blank applies no tags.
  tags:

  # Extra keyword arguments passed to the qbittorrent-api client. For example
  # VERIFY_WEBUI_CERTIFICATE: false for a WebUI behind a self-signed HTTPS certificate.
  options:

# SeaDex release-selection filters.
seadex:
  # What to do when a title's preferred release sits only on private trackers. Private releases are
  # never grabbed: SeaDex carries no download link for them, and no private-tracker auth is
  # supported.
  # Values:
  #   warn     - Warn and grab nothing. The title is re-checked every run until a public release
  #              covers the files.
  #   fallback - Grab a public release instead, chosen by the same settings. Warn only when none
  #              covers the files.
  private_releases: warn

  # Prefer dual-audio releases, even over a single-audio release marked best. When off, prefer
  # Japanese-audio releases the same way.
  prefer_dual_audio: true

  # Prefer releases SeaDex marks as best, among those matching the audio preference.
  want_best: true

  # SeaDex release tags to skip, e.g. Dolby Vision or Deband Required. Empty skips none.
  ignore_tags:

  # Tracker names considered during release selection, case-insensitive. Empty or absent considers
  # every named tracker except the Other and OtherPrivate catch-alls. A listed tracker is not
  # necessarily grabbable: private releases are never downloaded, and grabs come only from the
  # public trackers Pearlarr can parse.
  # Known: Nyaa, AnimeTosho, AniDex, RuTracker, AB, BeyondHD, PassThePopcorn, BroadcastTheNet,
  # HDBits, Blutopia, Aither, Other, OtherPrivate
  trackers:

  # AniList IDs never processed. Empty ignores none.
  ignore_anilist_ids:

  # Check titles again even when SeaDex has not updated their entries since the last check.
  ignore_seadex_update_times: false

# The wait pass: waiting for grabbed torrents and importing them. Sonarr only, except the
# pending-import bookkeeping.
imports:
  # When, if ever, to wait for grabbed torrents to finish downloading and then drive Sonarr's
  # import.
  # Values:
  #   off      - Disabled: no wait pass, no pending imports kept, no auto import.
  #   deferred - Never wait on a download: keep this run's grabs as pending imports and import
  #              earlier runs' finished ones, in one poll at the end of the run.
  #   blocking - The default: wait at the end of the run for downloads to finish, then import - this
  #              run's grabs and any pending import from an earlier run.
  wait_mode: blocking

  # Seconds to wait per torrent for qBittorrent to finish downloading it.
  download_timeout: 3600

  # Seconds to then wait for Sonarr to rescan and import the finished files. Measured from the last
  # file Pearlarr saw imported rather than the download's completion, so a season pack imported
  # file-by-file times out only after this long with no visible progress. Time spent waiting on
  # Sonarr's import work (its own import of the download, an import Pearlarr issued, or a disk
  # command holding the line) does not count, up to six times this value. A pending import still
  # waiting at that bound is left for the next run.
  import_timeout: 600

  # Seconds between polls of qBittorrent and the Sonarr queue while waiting.
  poll_interval: 30

  # Seconds between lightweight wait-screen refreshes (progress bars, speed, ETA) within each poll
  # interval. 0 disables the extra refreshes. Rows then advance once per poll_interval while
  # spinners and timers still animate. A value at or above poll_interval behaves as disabled.
  progress_poll_interval: 5

  # How the import takes finished files into the library. auto lets Sonarr choose between moving and
  # copying (a still-seeding torrent is copied). When Pearlarr reads a download's folder itself,
  # because Sonarr isn't serving that download, auto copies. copy is used as set. So is move, except
  # for a torrent Pearlarr tracks instead of adding SeaDex's (Sonarr's own grab of the same files,
  # say): that one is imported as auto.
  # Values: auto / move / copy
  import_mode: auto

  # Remove a torrent's leftover Sonarr queue record once its import is done. Sonarr clears a queue
  # record itself only when a single import covers the grab's full episode count, so a torrent
  # imported in several steps (some files imported by Sonarr, the rest by Pearlarr) stays parked in
  # its queue, where completed-download handling may import it again. Removing the record closes
  # that window: Sonarr marks the download as manually ignored, and the torrent keeps seeding in
  # qBittorrent. Sonarr only. Ignored when wait_mode is off.
  remove_from_queue: true

  # Sonarr quality name, e.g. Bluray-2160p, filling the gaps when a file's quality cannot be
  # detected. Useful on a 4K instance. Blank adds no default. A name matching no Sonarr quality
  # definition is warned about and ignored.
  default_quality:

  # Languages tagged on files imported from dual-audio releases. An empty list uses the default. A
  # file is never imported with no language (Sonarr would read it as Unknown and could re-grab it).
  # Default: [Japanese, English]
  languages_dual:

  # Languages tagged on files imported from single-audio releases. Empty uses the default, like
  # languages_dual.
  # Default: [Japanese]
  languages_single:

  # Target seconds between progress lines on a non-interactive console (Docker, cron) while a wait
  # pass runs.
  progress_line_interval: 300

# Notification webhooks. Either, both, or neither may be set.
notifications:
  # Discord webhook URL grab notifications are posted to. Blank disables them.
  discord_url:

  # Webhook URL (ntfy, gotify, Home Assistant, ...) receiving the wait-pass summary. Blank disables
  # it.
  wait_webhook_url:

  # Send a notification when a wait pass completes. Absent, it turns on automatically whenever any
  # webhook URL is set. An explicit value wins.
  wait_notify:

# Scheduled-mode cadence (the default command, run scheduled).
schedule:
  # Hours between scheduled runs.
  interval_hours: 6.0

# Rate limiting, the run cap, and logging.
advanced:
  # Seconds slept between API queries, as rate limiting. 0 disables the sleep.
  sleep_time: 0

  # Prompt for a choice when a title has several releases to grab, instead of choosing
  # automatically.
  interactive: false

  # Cap on torrents added per run. 0 removes the cap. Keeps a first run on a large library from
  # flooding qBittorrent. Past the cap a run still checks every title, so a torrent already in
  # qBittorrent is still tied to every title that lists it, and the held grabs are made on later
  # runs. Dry runs ignore the cap, so a dry run always reports the whole library.
  max_torrents_to_add: 10

  # Re-check titles whose files Sonarr or Radarr changed since the last run. Polls each arr's
  # history at run start. Turn off if a release you replaced arr-side keeps being re-grabbed.
  detect_arr_activity: true

  # Minimum level written to the console and the file log, case-insensitive.
  # Values: DEBUG / INFO / WARNING / ERROR / CRITICAL
  log_level: INFO

  # Console output format. auto resolves to rich on a terminal and plain when piped or under Docker.
  # plain and json also disable the live progress views.
  # Values: auto / rich / plain / json
  log_format: auto

  # How many days of dated log backups to keep. Each run rotates the previous run's log to a dated
  # backup. Backups older than this many days are deleted once the run's configuration loads.
  log_retention_days: 14

# ID and episode mapping sources. anibridge is the primary. The others fill anything it misses.
mappings:
  # Days downloaded mapping sources are kept before re-downloading. 0 re-downloads every run.
  refresh_days: 1

  # Kometa Anime-IDs source, used for IDs the primary graph misses. Blank auto-downloads it. false
  # disables it. An inline mapping is accepted.
  anime_ids:

  # AniDB anime-lists XML source, used for specials. Blank auto-downloads it. false disables it.
  anime_lists:

  # anibridge-mappings v3 graph, the primary source of IDs and per-season episode maps. Blank
  # auto-downloads it. false disables it. An inline mapping is accepted.
  anibridge:
