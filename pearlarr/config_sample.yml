# Schema version of the config file's keys and values. A file from an older Pearlarr is migrated
# automatically: every load brings it forward in memory, and a run rewrites the file itself (keeping
# a backup).
config_version: 7

# Sonarr connection and behavior. url and api_key are required only when a Sonarr run actually
# executes. A Radarr-only config still loads.
sonarr:
  # Base URL of the instance's web UI, e.g. http://localhost:8989 for Sonarr or
  # http://localhost:7878 for Radarr. Blank leaves this arr unconfigured, and it is not run.
  url:

  # API key of the instance, from Settings > General in its web UI. Blank leaves this arr
  # unconfigured, and it is not run.
  api_key:

  # Verify the instance's HTTPS certificate. Turn off only for a self-signed instance whose CA
  # cannot be trusted via the OS store or SSL_CERT_FILE.
  verify_ssl: true

  # Ignore library items the arr does not monitor. For Radarr this means unmonitored movies. For
  # Sonarr, unmonitored series or titles whose episodes are all unmonitored.
  ignore_unmonitored: false

  # qBittorrent category applied to torrents grabbed for this arr. Omitted adopts the category set
  # on this arr's own qBittorrent download client; an explicit blank ("") keeps no category at all.
  # The adopted client should be the qBittorrent instance Pearlarr itself talks to; with several
  # enabled, the lowest priority number wins (which client the arr uses for a download is not
  # predictable from outside). The arr never sees a torrent in a category none of its qBittorrent
  # clients watch. When Sonarr has an enabled qBittorrent client, Pearlarr imports each finished
  # torrent in such a category from its download folder itself (not with imports.wait_mode: off).
  # Radarr imports nothing from such a category.
  torrent_category:

  # qBittorrent category applied once every import using a torrent grabbed for this arr has
  # completed. Lets finished torrents carry their own seeding rules. A torrent shared by several
  # titles, or by Sonarr and Radarr, moves only after all of them have imported. Point
  # delete-with-data cleanup scripts at this category alone - a SeaDex update can list an
  # already-moved torrent under another title, and deleted data is re-downloaded. Omitted adopts the
  # post-import category set on this arr's own qBittorrent download client (the same client as for
  # torrent_category); an explicit blank ("") keeps the add-time category. A torrent in a category
  # this arr doesn't watch is never moved into one it does, where the arr would import it a second
  # time its own way. Ignored when imports.wait_mode is off.
  post_import_category:

# Radarr connection and behavior. url and api_key are required only when a Radarr run actually
